[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "efficientai-sdk"
dynamic = ["version"]
description = "Python SDK for EfficientAI: live traces, simulations and evaluations for voice and chat agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "EfficientAI" }]
keywords = ["efficientai", "voice agents", "observability", "opentelemetry", "evaluation", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25,<1",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
# Live tracing over OTLP. Framework-specific extras (pipecat, livekit) are
# added with the tracing API in EFF-109.
otel = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.urls]
Homepage = "https://efficientai.cloud"
Documentation = "https://docs.efficientai.cloud"
Source = "https://github.com/EfficientAI-tech/efficientAI/tree/main/sdks/python"
Changelog = "https://github.com/EfficientAI-tech/efficientAI/blob/main/sdks/python/CHANGELOG.md"

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.version]
path = "src/efficientai_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/efficientai_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/efficientai_sdk", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Keep Optional[...]: pydantic evaluates annotations at runtime and `X | None` breaks on 3.9.
ignore = ["UP007", "UP045"]

[tool.mypy]
python_version = "3.10"  # oldest target current mypy supports
strict = true
packages = ["efficientai_sdk"]
mypy_path = "src"
